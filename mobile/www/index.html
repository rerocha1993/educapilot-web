<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EducaPilot</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f8fafc; color: #0f172a;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); text-align: center; }
    @media (prefers-color-scheme: dark) { body { background: #0b1220; color: #e2e8f0; } }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { margin: 0 0 20px; opacity: .75; line-height: 1.4; }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px 22px;
      background: #2563eb; color: #fff; }
  </style>
</head>
<body>
  <main>
    <h1>Sem conexão</h1>
    <p>Não foi possível abrir o EducaPilot. Confira sua internet e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
